name: GRC Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  GRC_ROLE_ARN: arn:aws:iam::846470648858:role/acme-github-grc-role
  EVIDENCE_BUCKET: acme-evidence-vault-c1aa6b62

jobs:
  grc-gate:
    name: HIPAA GRC Gate
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GRC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: grc-gate-session

      - name: Install Conftest 0.45.0
        run: |
          VERSION=0.45.0
          curl -L -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Install OPA for Rego unit tests
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Terraform init
        working-directory: terraform/grc
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/grc
        run: terraform validate

      - name: Terraform plan (JSON)
        working-directory: terraform/grc
        run: |
          terraform plan -out tfplan.binary -input=false
          terraform show -json tfplan.binary > tfplan.json

      - name: Run Rego unit tests
        run: opa test policy/hipaa -v

      - name: Run HIPAA Rego policies with Conftest (JSON)
        working-directory: terraform/grc
        run: |
          set -o pipefail
          conftest test tfplan.json -p ../../conftest/test --output json | tee conftest-results.json

      - name: Fail if Conftest found violations
        working-directory: terraform/grc
        run: |
          conftest test tfplan.json -p ../../conftest/test >/dev/null

      - name: Sign Terraform plan with KMS (SHA-256 digest)
        working-directory: terraform/grc
        run: |
          sha256sum tfplan.json | awk '{print $1}' | xxd -r -p > tfplan.sha256
          aws kms sign \
            --key-id arn:aws:kms:us-east-1:846470648858:key/d92522bb-2f8a-4cd4-b2a1-d833414842a3 \
            --message fileb://tfplan.sha256 \
            --message-type DIGEST \
            --signing-algorithm RSASSA_PSS_SHA_256 \
            --output json > tfplan.sig.json

      - name: Sign Conftest results with KMS (SHA-256 digest)
        working-directory: terraform/grc
        run: |
          sha256sum conftest-results.json | awk '{print $1}' | xxd -r -p > conftest-results.sha256
          aws kms sign \
            --key-id arn:aws:kms:us-east-1:846470648858:key/d92522bb-2f8a-4cd4-b2a1-d833414842a3 \
            --message fileb://conftest-results.sha256 \
            --message-type DIGEST \
            --signing-algorithm RSASSA_PSS_SHA_256 \
            --output json > conftest-results.sig.json

      - name: Generate machine-readable evidence (JSON)
        working-directory: terraform/grc
        run: |
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          cat <<EOF > evidence.json
          {
            "framework": "HIPAA Security Rule",
            "controls": [
              "164.312(a)(2)(iv)",
              "164.312(e)(1)",
              "164.308(a)(1)(ii)(D)"
            ],
            "artifacts": {
              "terraform_plan": "tfplan.json",
              "policy_results": "conftest-results.json"
            },
            "timestamp": "$ts"
          }
          EOF

      - name: Upload JSON evidence artifacts to S3
        if: always()
        working-directory: terraform/grc
        run: |
          aws s3 cp tfplan.json "s3://${EVIDENCE_BUCKET}/grc-evidence/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/tfplan.json"
          aws s3 cp conftest-results.json "s3://${EVIDENCE_BUCKET}/grc-evidence/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/conftest-results.json"
          aws s3 cp evidence.json "s3://${EVIDENCE_BUCKET}/grc-evidence/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/evidence.json"

      - name: Build evidence bundle
        if: always()
        working-directory: terraform/grc
        run: |
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p evidence
          cp tfplan.json evidence/
          cp tfplan.sig.json evidence/
          cp conftest-results.json evidence/ || true
          cp conftest-results.sig.json evidence/ || true
          cp evidence.json evidence/
          tar czf "evidence-${ts}.tar.gz" evidence
          echo "EVIDENCE_ARCHIVE=evidence-${ts}.tar.gz" >> $GITHUB_ENV

      - name: Upload evidence bundle to S3
        if: always()
        working-directory: terraform/grc
        run: |
          aws s3 cp "$EVIDENCE_ARCHIVE" "s3://${EVIDENCE_BUCKET}/grc-evidence/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/$EVIDENCE_ARCHIVE"
